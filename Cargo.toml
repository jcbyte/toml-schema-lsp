[package]
name = "toml_schema_extension_server"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
line-index = "0.1.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde_json = "1.0.154"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.8"
toml-schema = { git = "https://github.com/brunoborges/toml-schema", tag = "v1.0.0-rc.2" }
toml_edit = { version = "0.22.0", features = ["serde"] }
tower-lsp = "0.20.0"
